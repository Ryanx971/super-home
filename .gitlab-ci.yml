image: node:16

stages:
  - security
  - test

# Install pnpm than cache
before_script:
  - curl -f https://get.pnpm.io/v6.16.js | node - add --global pnpm@7
  - pnpm config set store-dir .pnpm-store
  #- pnpm install
cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .pnpm-store

audit:
  stage: security
  allow_failure: false
  script: pnpm audit --audit-level=critical

unit-test:
  stage: test
  script:
    - pnpm run test:ci
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - coverage/
    when: always
    reports:
      junit:
        - junit.xml

