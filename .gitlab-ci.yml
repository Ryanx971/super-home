image: node:16

stages:
  - security
  - test
  - pages

before_script:
  - curl -f https://get.pnpm.io/v6.16.js | node - add --global pnpm@7
  - pnpm config set store-dir .pnpm-store
  - pnpm install

cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .pnpm-store

audit:
  stage: security
  script: pnpm audit --audit-level=critical

unit-test:
  stage: test
  script:
    - pnpm run test:ci
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

pages:
  stage: pages
  script:
    - pnpm run gitlab:build
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

