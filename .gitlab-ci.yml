image: node:16

stages:
  - security
  - test
  - build
  - deploy

before_script:
  - curl -f https://get.pnpm.io/v6.16.js | node - add --global pnpm@7
  - pnpm config set store-dir .pnpm-store
  - pnpm install
cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - .pnpm-store

audit:
  stage: security
  script: pnpm audit --audit-level=critical

unit-test:
  stage: test
  script:
    - pnpm run test:ci
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

build:
  stage: build
  variables:
    PUBLIC_URL: https://ryan.baloji.gitlab.io/super-home/
  script:
    - pnpm run build
  artifacts:
    paths:
      - build/

deploy:
  stage: deploy
  variables:
    GIT_STRATEGY: none # Do not clone git repository
  script:
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

