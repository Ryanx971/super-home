image: node:16

stages:
  - test

unit-test:
  stage: test
  before_script:
    - curl -f https://get.pnpm.io/v6.16.js | node - add --global pnpm@7
    - pnpm config set store-dir .pnpm-store
    - pnpm install
  script:
    - pnpm run test:ci
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - coverage/
    when: always
    reports:
      junit:
        - junit.xml

