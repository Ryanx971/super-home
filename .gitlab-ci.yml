image: node:16

stages:
  - security
  - test
  - pages

.install:
  before_script:
    - curl -f https://get.pnpm.io/v6.16.js | node - add --global pnpm@7
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

audit:
  stage: security
  extends: .install
  script: pnpm audit --audit-level=critical

unit-test:
  stage: test
  extends: .install
  script:
    - pnpm run test:ci

pages:
  stage: pages
  extends: .install
  script:
    - pnpm run gitlab:build
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  only:
    - main

